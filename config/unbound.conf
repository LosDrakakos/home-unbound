server:
  username: ""
  chroot: ""
  directory: "/etc/unbound"
  pidfile: ""
  do-daemonize: no
  use-syslog: no
  logfile: ""
  log-time-ascii: yes
  verbosity: 1
  port: 53
  module-config: "validator iterator"
  auto-trust-anchor-file: "/data/unbound/root.key"

  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  qname-minimisation: yes
  aggressive-nsec: yes
  hide-identity: yes
  hide-version: yes
  prefetch: yes
  prefetch-key: yes
  edns-buffer-size: 1232
  deny-any: yes
  minimal-responses: yes
  val-clean-additional: yes
  so-reuseport: yes

  num-threads: 2
  msg-cache-size: 32m
  rrset-cache-size: 64m
  key-cache-size: 8m
  neg-cache-size: 4m

  access-control: 0.0.0.0/0 refuse
  access-control: ::0/0 refuse
  access-control: 127.0.0.0/8 allow
  access-control: ::1 allow
  access-control: 10.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow
  access-control: 100.64.0.0/10 allow
  access-control: 169.254.0.0/16 allow
  access-control: fc00::/7 allow
  access-control: fe80::/10 allow

include: "/run/unbound/network.conf"
include: "/data/unbound/local-records.conf"
include: "/etc/unbound/custom.d/*.conf"

remote-control:
  control-enable: yes
  control-interface: "/run/unbound/control.sock"
  control-use-cert: no
